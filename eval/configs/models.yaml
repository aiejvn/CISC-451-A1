defaults:
  quantization: nf4      # nf4 | int8 | bf16 | none (none = checkpoint's native dtype)
  max_new_tokens: 2048
  batch_size: 128

# Models are HF repo ids ({author}/{name}); the HF cache downloads them on first use.
models:
  - author: Qwen
    name: Qwen3-8B
    family: qwen3
    quantization: none  
    thinking: false
  - author: openai
    name: gpt-oss-20b
    family: gpt_oss
    quantization: none  
    reasoning_effort: low
  - author: deepseek-ai
    name: DeepSeek-R1-Distill-Qwen-14B
    family: reasoning_default
    quantization: none  
